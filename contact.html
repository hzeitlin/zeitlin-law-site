<!DOCTYPE html>

    <style>
        :root {

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'EB Garamond', Garamond, Georgia, serif; color: var(--wachtell-dark); background-color: #FFFFFF; line-height: 1.7; font-size: 19px; }
        a { color: inherit; text-decoration: none; }
        a:hover { color: var(--wachtell-muted); text-decoration: underline; }

        header { text-align: center; padding: 4.5rem 1rem 2rem 1rem; background: #FFFFFF; }
        .firm-logo { font-family: 'EB Garamond', serif; font-size: 2.5rem; font-weight: 600; letter-spacing: 0.08em; color: var(--wachtell-dark); text-transform: uppercase; margin-bottom: 0.3rem; }

        nav { border-top: 2px solid var(--wachtell-dark); border-bottom: 1px solid var(--wachtell-border); margin: 2rem auto; max-width: 900px; background: var(--wachtell-light-bg); position: sticky; top: 0; z-index: 1000; }
        .nav-links { display: flex; justify-content: center; list-style: none; gap: 2.5rem; padding: 0.9rem 1rem; font-family: 'Inter', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--wachtell-dark); }
        .nav-links a.active { font-weight: 600; text-decoration: underline; }

        main { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 5rem 1.5rem; }
        section { margin-bottom: 4rem; }

        p { margin-bottom: 1.2rem; text-align: left; }
